[packages.homebrew]
# mise moved to the official mise.run installer (run_once_after_23-mise), which
# ships the optimised release binary and can self-update; the brew formula is a
# separate, slower build that cannot. Drop this entry once every mac has applied.
to_remove = ["mise"]

# Not managed here on purpose:
#   chezmoi - installed by the bootstrap install script before this repo exists
#   mise    - installed by run_once_after_23-mise from mise.run on both OSes

[packages.homebrew.common]
casks = ["bitwarden", "ghostty"]
formulae = [
"curl",
"fzf",
"git",
"gpg",
"jq",
"openssl",  # SSL/TLS cryptography
"starship", # Shell prompt
"rbw",      # Bitwarden client backing every secret template
"ripgrep",  # Search tool
"tree",
"wget",
"zsh",
]

[packages.homebrew.personal_computer]
casks = [
"claude",     # desktop app; the claude CLI comes from run_once_after_22-claude-code
"zen",
"firefox",
"google-chrome",
"protonvpn",
"docker-desktop",
"google-drive",
"marta",
"netbirdio/tap/netbird-ui",
"obsidian",
"raycast",
"rcloneview",
"slack",
"spotify",
"syncthing-app",
"tailscale-app",
"veracrypt",  # pulls in macfuse as a cask dependency
"vlc",
"xnviewmp",
"zoom",
]
formulae = [
"gallery-dl",
"rclone",
]

[packages.homebrew.work_computer]
casks = ["1password"]
formulae = []

[packages.homebrew.dev_computer]
casks = ["bruno", "visual-studio-code"]
formulae = [
"awscli",
"biome", # the global VS Code default formatter
"gh",
"git-lfs", # large files in work repos; the LFS filter is set in dot_config/git/config.tmpl
"pnpm",  # not a mise tool: pnpm 12 ships no darwin/amd64 binary, so only brew's source build runs on the Intel Mac
"peak/tap/s5cmd",             # fast S3 client for the runpod buckets
"runpod/runpodctl/runpodctl",
"rtk",   # token-saving CLI proxy that the Claude Code hook routes shell commands through
"tmux", # Terminal multiplexer
"mosh", # SSH over flaky links; needs mosh-server on the far end too
]

# ---------------------------------------------------------------------------
# apt (Debian / Ubuntu / Proxmox)
#
# Packages installable with apt, whether from the Debian archive or from a vendor
# repo added by run_onchange_before_09-apt-repos. Repo-backed entries are marked;
# they only resolve after that script has run.
#
# Tools with no apt package at all (gron, herdr) are installed by mise from
# [tools] in dot_config/mise/config.toml.tmpl. mise itself is absent from this
# list: it comes from mise.run in run_once_after_23-mise on every machine, so
# that `mise bootstrap` and self-update work the same way on both OSes. rbw is
# also absent: it has no apt package, and it is needed before chezmoi reads the
# source state — earlier than any script, mise included — so
# .install-prerequisites.sh installs it and run_onchange_after_21-rbw only
# converges it after a pin bump.
#
# ---------------------------------------------------------------------------

[packages.apt]
# See the homebrew to_remove above: mise now comes from mise.run, not the vendor
# apt repo. Drop this entry once every Debian box has applied.
to_remove = ["mise"]

[packages.apt.common]
packages = [
"ca-certificates",
"curl",
"fzf",
"git",
"gnupg",           # gpg on darwin
"jq",
"lftp",
"locales",         # so the en_US.UTF-8 that SSH forwards from the Mac exists here
"openssl",         # SSL/TLS cryptography
"pinentry-tty",    # rbw's master password prompt; curses has issues with ssh sessions 
"starship",        # Shell prompt
"ripgrep",         # Search tool
"tree",
"unzip",
"vim",
"wget",
"zsh",
# vendor repo: docker
"containerd.io",
"docker-buildx-plugin",
"docker-ce",
"docker-ce-cli",
"docker-compose-plugin",
# vendor repo: tailscale
"tailscale",
]

[packages.apt.dev_computer]
packages = [
"build-essential", # make, etc
"tmux",            # Terminal multiplexer
"mosh",            # client and server in one package; only dev boxes are moshable
"gh",              # vendor repo: cli.github.com
"git-lfs",         # large files in work repos; the LFS filter is set in dot_config/git/config.tmpl
]

# Linux boxes are headless; GUI apps are darwin-only.
[packages.apt.personal_computer]
packages = []
