[packages.homebrew]
to_remove = ["licecap", "glow", "gemini-cli", "lftp", "bitwarden-cli"]

# bitwarden-cli is in to_remove, not just absent: rbw replaced it everywhere,
# and `bw` left on PATH is a second, stateless client competing for the vault.
#
# Not managed here on purpose:
#   awscli  - not installed on either OS; use the official installer on the boxes
#             that need it (the ~/.config/aws profiles stay either way)
#   chezmoi - installed by the bootstrap install script before this repo exists
#   claude  - installed by run_once_after_22-claude-code on both OSes, because
#             the official installer is what put ~/.local/bin/claude in place
#             (the `claude` cask is the desktop app, a different artifact)

[packages.homebrew.common]
casks = ["bitwarden", "ghostty"]
formulae = [
"curl",
"git",           # Markdown reader
"gpg",
"gron",
"jq",
"openssl",       # SSL/TLS cryptography
"rbw",           # Bitwarden client backing every secret template
"ripgrep",       # Search tool
"tree",
"wget",
"zsh",
]

[packages.homebrew.personal_computer]
casks = [
"zen",
"protonvpn",
"docker-desktop",
"google-drive",
"marta",
"obsidian",
"raycast",
"slack",
"spotify",
"syncthing-app",
"tailscale-app",
"xnviewmp",
"zoom",
]
formulae = []

[packages.homebrew.dev_computer]
casks    = ["bruno", "visual-studio-code"]
formulae = ["mise", "hashicorp/tap/terraform", "tflint", "ansible", "gh"]

# ---------------------------------------------------------------------------
# apt (Debian / Ubuntu / Proxmox)
#
# Packages installable with apt, whether from the Debian archive or from a vendor
# repo added by run_onchange_before_09-apt-repos. Repo-backed entries are marked;
# they only resolve after that script has run.
#
# Tools with no apt package at all are installed from a pinned release by
# run_onchange_after_20-release-tools (gron, tflint); versions live in
# packages.yaml. rbw is the exception: absent from Debian stable, and needed
# before chezmoi reads the source state, so .install-prerequisites.sh installs
# it and run_onchange_after_21-rbw only converges it after a pin bump.
#
# Still deliberately absent on Linux: glow (removed on darwin too) and awscli
# (the Debian package lags badly, and it is no longer managed on darwin either —
# see the note at the top of this file).
# ---------------------------------------------------------------------------

[packages.apt]
to_remove = []

[packages.apt.common]
packages = [
"ca-certificates",
"curl",
"git",
"gnupg",   # gpg on darwin
"jq",
"lftp",
"openssl",         # SSL/TLS cryptography
"pinentry-curses", # rbw's master password prompt on headless boxes
"ripgrep",         # Search tool
"tree",
"unzip",   # needed by the release-download installers
"wget",
"zsh",
# vendor repo: docker
"containerd.io",
"docker-buildx-plugin",
"docker-ce",
"docker-ce-cli",
"docker-compose-plugin",
# vendor repo: tailscale
"tailscale",
]

[packages.apt.dev_computer]
packages = [
"ansible",
"gh",        # vendor repo: cli.github.com
"mise",      # vendor repo: mise.jdx.dev
"terraform", # vendor repo: apt.releases.hashicorp.com
]

# Linux boxes here are headless homelab members; GUI apps are darwin-only.
[packages.apt.personal_computer]
packages = []
