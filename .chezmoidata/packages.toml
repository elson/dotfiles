[packages.homebrew]
to_remove = []

# Not managed here on purpose:
#   chezmoi - installed by the bootstrap install script before this repo exists

[packages.homebrew.common]
casks = ["bitwarden", "ghostty"]
formulae = [
"curl",
"fzf",
"git",
"gpg",
"jq",
"mise",     # tool manager; common because it owns gron/herdr everywhere
"openssl",  # SSL/TLS cryptography
"starship", # Shell prompt
"rbw",      # Bitwarden client backing every secret template
"ripgrep",  # Search tool
"tree",
"wget",
"zsh",
]

[packages.homebrew.personal_computer]
casks = [
"zen",
"protonvpn",
"docker-desktop",
"google-drive",
"marta",
"netbirdio/tap/netbird-ui",
"obsidian",
"raycast",
"slack",
"spotify",
"syncthing-app",
"tailscale-app",
"xnviewmp",
"zoom",
]
formulae = []

[packages.homebrew.dev_computer]
casks = ["bruno", "visual-studio-code"]
formulae = [
"gh",
"tmux", # Terminal multiplexer
"mosh", # SSH over flaky links; needs mosh-server on the far end too
]

# ---------------------------------------------------------------------------
# apt (Debian / Ubuntu / Proxmox)
#
# Packages installable with apt, whether from the Debian archive or from a vendor
# repo added by run_onchange_before_09-apt-repos. Repo-backed entries are marked;
# they only resolve after that script has run.
#
# Tools with no apt package at all (gron, herdr) are installed by mise from
# [tools] in dot_config/mise/config.toml.tmpl — which is why mise itself is a
# common package here rather than a dev_computer one. rbw is the exception: it
# has no apt package either, but it is needed before chezmoi reads the source
# state — earlier than any script, mise included — so .install-prerequisites.sh
# installs it and run_onchange_after_21-rbw only converges it after a pin bump.
#
# ---------------------------------------------------------------------------

[packages.apt]
to_remove = []

[packages.apt.common]
packages = [
"ca-certificates",
"curl",
"fzf",
"git",
"gnupg",           # gpg on darwin
"jq",
"lftp",
"locales",         # so the en_US.UTF-8 that SSH forwards from the Mac exists here
"mise",            # vendor repo: mise.jdx.dev; common because it owns gron/herdr everywhere
"openssl",         # SSL/TLS cryptography
"pinentry-tty",    # rbw's master password prompt; curses has issues with ssh sessions 
"starship",        # Shell prompt
"ripgrep",         # Search tool
"tree",
"unzip",
"vim",
"wget",
"zsh",
# vendor repo: docker
"containerd.io",
"docker-buildx-plugin",
"docker-ce",
"docker-ce-cli",
"docker-compose-plugin",
# vendor repo: tailscale
"tailscale",
]

[packages.apt.dev_computer]
packages = [
"build-essential", # make, etc
"tmux",            # Terminal multiplexer
"mosh",            # client and server in one package; only dev boxes are moshable
"gh",              # vendor repo: cli.github.com
]

# Linux boxes are headless; GUI apps are darwin-only.
[packages.apt.personal_computer]
packages = []
